services:
  - type: web
    name: easytrip-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: BOT_TOKEN
        sync: false
      - key: DATABASE_PATH
        value: /var/data/easytrip.db
      - key: ALLOWED_ORIGINS
        value: https://marckgulyaev-art.github.io
    disk:
      name: easytrip-data
      mountPath: /var/data
      sizeGB: 1